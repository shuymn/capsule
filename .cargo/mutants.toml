# cargo-mutants settings for `mise run test:mutants` (see docs/testing.md).

# The benchmark harness is not shipped behavior.
exclude_globs = ["crates/prompt-bench/**"]
# Judge each mutant by the whole suite: the CLI contract and docs tests also
# pin core and protocol behavior.
test_workspace = true

# Equivalent mutants: no test can tell them from the original.
exclude_re = [
  # The OR'ed waitid flags are disjoint bits, so `^` equals `|`.
  'replace \| with \^ in observe_exit$',
  # Darwin's zombie-group EPERM arm: no other platform returns EPERM there.
  # On macOS, run once without this entry to check the arm.
  '(match guard .*|&& with \|\|) in terminate_group$',
  # These already return `Poll::Ready(Ok(()))`.
  'Pipe>::poll_(flush|shutdown) -> ',
]
