name: Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer increment for the release candidate
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  propose:
    name: Propose release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MAINTAIN_APP_ID }}
          private-key: ${{ secrets.MAINTAIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install git-cliff
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: git-cliff@2.13.1

      - name: Get GitHub App user ID
        id: app-user
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create or update release PR
        run: |
          set -euo pipefail

          base_sha="$(git rev-parse HEAD)"
          version="$(bash scripts/release/candidate.sh "$BUMP")"
          release_branch="release/v${version}"
          title="chore(release): prepare v${version}"
          body="$(printf '%s\n\n%s\n%s' \
            "Automated release candidate for v${version}." \
            "- SemVer increment: \`${BUMP}\`" \
            "- Base commit: \`${base_sha}\`")"

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git add Cargo.toml Cargo.lock crates/cli/CHANGELOG.md
          git commit --message "$title"

          remote_ref="refs/heads/${release_branch}"
          push_args=()
          if git fetch --quiet origin "${remote_ref}:refs/remotes/origin/${release_branch}" 2>/dev/null; then
            expected_sha="$(git rev-parse "refs/remotes/origin/${release_branch}")"
            push_args+=("--force-with-lease=${remote_ref}:${expected_sha}")
          fi
          git push "${push_args[@]}" origin "HEAD:${remote_ref}"

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$release_branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"
            pr_url="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          else
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$release_branch" \
              --title "$title" \
              --body "$body")"
          fi

          echo "Release PR: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
