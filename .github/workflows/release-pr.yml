name: Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer increment for the release candidate
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  propose:
    name: Propose release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MAINTAIN_APP_ID }}
          private-key: ${{ secrets.MAINTAIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install git-cliff
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: git-cliff@2.13.1

      - name: Create or update release PR
        run: bash scripts/release/propose.sh
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
