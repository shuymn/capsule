name: Release PR

on:
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  propose:
    name: Propose release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MAINTAIN_APP_ID }}
          private-key: ${{ secrets.MAINTAIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      # release-plz/action does not expose --registry-manifest-path. Keep this
      # workaround inside the candidate producer until release-plz can compare
      # against the previous git release without a registry-compatible manifest.
      - name: Prepare release baseline manifest
        id: release-baseline
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n '1p')"
          if [[ -z "$latest_tag" ]]; then
            echo "no vX.Y.Z release tag found" >&2
            exit 1
          fi
          baseline_dir="${RUNNER_TEMP}/release-baseline"
          git worktree add --detach "$baseline_dir" "$latest_tag"
          echo "manifest=$(realpath "${baseline_dir}/Cargo.toml")" >> "$GITHUB_OUTPUT"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@30b5ca8b54e1dcffd9548bc87ede1531310fdc67 # v1.20.0
        env:
          # Updated with the action by the Renovate custom manager.
          BINSTALL_VERSION: 1.20.0

      - name: Install release-plz
        run: |
          cargo-binstall \
            release-plz@0.3.159 \
            --force \
            --strategies=crate-meta-data,compile \
            --no-confirm

      - name: Configure git user from GitHub token
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4 # v0.1.2
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update release PR
        run: |
          release-plz release-pr \
            --git-token "$GITHUB_TOKEN" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --registry-manifest-path "$REGISTRY_MANIFEST_PATH" \
            --forge github
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REGISTRY_MANIFEST_PATH: ${{ steps.release-baseline.outputs.manifest }}
