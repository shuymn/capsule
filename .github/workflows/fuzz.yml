name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: Fuzzing time per target, as cargo-bolero -T accepts it
        required: true
        default: "10m"

env:
  CI_MISE_VERSION: 2026.10.24

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: capsule-protocol
            target: session::tests::fuzz::accepted_frames_re_encode_to_an_equal_value
          - package: capsule-protocol
            target: session::tests::fuzz::framing_is_independent_of_chunking_and_cancellation
          - package: capsule-core
            target: plan::tests::arbitrary_configuration_text_respects_the_plan_limits
          - package: capsule-core
            target: plan::tests::generated_configurations_respect_the_plan_limits
          - package: capsule-core
            target: git::tests::porcelain_counts_match_the_line_prefixes

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          cache: true

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.CI_MISE_VERSION }}

      - name: Fuzz
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          DURATION: ${{ inputs.duration || '10m' }}
        run: mise run test:fuzz "$PACKAGE" "$TARGET" -T "$DURATION"

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashes-${{ strategy.job-index }}
          path: crates/*/src/**/__fuzz__/*/crashes/
