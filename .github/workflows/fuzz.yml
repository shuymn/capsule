name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: Fuzzing time per target, as cargo-bolero -T accepts it (default 5m)
        required: false

env:
  CI_MISE_VERSION: 2026.11.1

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: nightly
          cache: false

      - name: Install cargo-bolero dependencies
        run: sudo apt-get update && sudo apt-get install --yes binutils-dev libunwind-dev

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: ${{ env.CI_MISE_VERSION }}

      - name: Fuzz every target
        env:
          DURATION: ${{ inputs.duration || '5m' }}
        run: |
          targets=$(mise exec cargo:cargo-bolero -- cargo +nightly bolero list |
            jq --raw-output 'select(.test) | "\(.package) \(.test)"')
          status=0
          while read -r package target; do
            mise run test:fuzz "$package" "$target" -T "$DURATION" < /dev/null || status=1
          done <<< "$targets"
          exit "$status"

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashes
          path: crates/*/src/**/__fuzz__/*/crashes/
