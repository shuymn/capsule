name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      - name: Set up Task
        uses: shuymn/github-actions/.github/actions/setup-task@424c0953bfceb6e885eb6d9a7243836c83ea4bb7 # main

      - name: Test release contract
        if: matrix.os == 'ubuntu-latest'
        run: task release:test

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: task fmt:check

      - name: Run Clippy
        run: task lint

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      - name: Set up Task
        uses: shuymn/github-actions/.github/actions/setup-task@424c0953bfceb6e885eb6d9a7243836c83ea4bb7 # main

      - name: Install zsh
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Install uv
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          # A minor pin resolves from install-action's checksummed manifest; an exact
          # version newer than the manifest falls back to crates.io via cargo-binstall.
          tool: uv@0.13

      - name: Run tests
        run: task test

      - name: Run interactive shell contract
        run: task test:pty

  build:
    name: Build (${{ matrix.os }})
    needs: test
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true

      - name: Set up Task
        uses: shuymn/github-actions/.github/actions/setup-task@424c0953bfceb6e885eb6d9a7243836c83ea4bb7 # main

      - name: Build workspace
        run: task build
