name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Required by actions/attest to persist artifact attestations.
      attestations: write
      # Required by actions/attest to request a Sigstore OIDC certificate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: arm64
            cross: true
    env:
      ARCHIVE_NAME: capsule-${{ github.ref_name }}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cross

      - name: Build release binary
        run: $CARGO_CMD build --package capsule-cli --release --locked --target "$TARGET"
        env:
          CARGO_CMD: ${{ matrix.cross && 'cross' || 'cargo' }}
          TARGET: ${{ matrix.target }}

      - name: Create archive
        run: |
          tar -czf "$ARCHIVE_NAME" -C "target/${TARGET}/release" capsule
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
        env:
          TARGET: ${{ matrix.target }}

      - name: Generate artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capsule-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Extract release notes
        run: |
          if [ -f crates/cli/CHANGELOG.md ]; then
            version="${GITHUB_REF_NAME#v}"
            awk "/^## \\[${version}\\]/{if(p) exit; p=1; next} /^## \\[/{if(p) exit} p" crates/cli/CHANGELOG.md > /tmp/release-notes.md
          else
            touch /tmp/release-notes.md
          fi

      - name: Verify assets and upsert GitHub Release
        run: |
          set -euo pipefail

          archives=(
            "artifacts/capsule-darwin-arm64/capsule-${TAG_NAME}-darwin-arm64.tar.gz"
            "artifacts/capsule-linux-amd64/capsule-${TAG_NAME}-linux-amd64.tar.gz"
            "artifacts/capsule-linux-arm64/capsule-${TAG_NAME}-linux-arm64.tar.gz"
          )
          assets=()

          for archive in "${archives[@]}"; do
            checksum="$archive.sha256"
            test -f "$archive"
            test -f "$checksum"
            (cd "$(dirname "$archive")" && shasum -a 256 --check "$(basename "$checksum")")
            assets+=("$archive" "$checksum")
          done

          if release_is_draft="$(
            gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' \
              2>/dev/null
          )"; then
            if [[ "$release_is_draft" == "true" ]]; then
              gh release upload "$TAG_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber \
                "${assets[@]}"

              gh release edit "$TAG_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$TAG_NAME" \
                --notes-file /tmp/release-notes.md \
                --verify-tag \
                --draft=false
            else
              missing_assets=()
              mapfile -t existing_assets < <(
                gh release view "$TAG_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json assets \
                  --jq '.assets[].name'
              )

              for asset in "${assets[@]}"; do
                asset_name="$(basename "$asset")"
                asset_exists=false
                for existing_asset in "${existing_assets[@]}"; do
                  if [[ "$existing_asset" == "$asset_name" ]]; then
                    asset_exists=true
                    break
                  fi
                done

                if [[ "$asset_exists" == "false" ]]; then
                  missing_assets+=("$asset_name")
                fi
              done

              if ((${#missing_assets[@]} > 0)); then
                printf 'published release %s is missing immutable assets:\n' "$TAG_NAME" >&2
                printf '  %s\n' "${missing_assets[@]}" >&2
                echo "cannot repair published release assets without mutating the release" >&2
                exit 1
              fi
            fi
          else
            gh release create "$TAG_NAME" \
              "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
