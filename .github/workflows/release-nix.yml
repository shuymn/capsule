name: Release Nix Cache

on:
  push:
    tags:
      - 'v*'

jobs:
  cache:
    name: Nix cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Set up Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: shuymn
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Push Nix package outputs to Cachix
        run: |
          paths="$(nix build --no-link --no-update-lock-file --print-build-logs --print-out-paths .#default .#capsule)"
          printf '%s\n' "$paths" | sort -u | xargs cachix push shuymn
