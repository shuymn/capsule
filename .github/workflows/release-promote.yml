name: Release Promote

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Number of the merged Release PR
        required: true
        type: number
  workflow_call:
    inputs:
      release_pr:
        description: Number of the merged Release PR
        required: true
        type: number
    secrets:
      MAINTAIN_APP_PRIVATE_KEY:
        description: Private key for the maintain GitHub App
        required: true

concurrency:
  group: release-promote
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    name: Promote release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gh pr view reads the release PR metadata.
      pull-requests: read

    steps:
      - name: Resolve merged release candidate
        id: candidate
        run: |
          set -euo pipefail
          pull_request="$(
            gh pr view "$RELEASE_PR" \
              --repo "$GITHUB_REPOSITORY" \
              --json state,baseRefName,headRefOid
          )"
          if [[ "$(jq -r .state <<<"$pull_request")" != "MERGED" ]]; then
            echo "release PR is not merged: #$RELEASE_PR" >&2
            exit 1
          fi
          if [[ "$(jq -r .baseRefName <<<"$pull_request")" != "main" ]]; then
            echo "release PR does not target main: #$RELEASE_PR" >&2
            exit 1
          fi
          candidate_sha="$(jq -r .headRefOid <<<"$pull_request")"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release PR has an invalid head commit: #$RELEASE_PR" >&2
            exit 1
          fi
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}

      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.candidate.outputs.sha }}
          persist-credentials: false

      - name: Verify candidate is merged into main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD; then
            echo "release candidate is not reachable from main: $RELEASE_SHA" >&2
            exit 1
          fi
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Set up Task
        uses: shuymn/github-actions/.github/actions/setup-task@e3d3485d66cf3fe598d8954fff89e81c5cac57e0

      - name: Verify release contract
        id: contract
        run: |
          set -euo pipefail
          tag="$(task --silent release:check)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}

      - name: Report existing promotion
        if: steps.contract.outputs.tag_exists == 'true'
        run: echo "$TAG already points to $RELEASE_SHA; nothing to do"
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          TAG: ${{ steps.contract.outputs.tag }}

      - name: Generate GitHub App token
        if: steps.contract.outputs.tag_exists != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.MAINTAIN_APP_ID }}
          private-key: ${{ secrets.MAINTAIN_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create and push release tag
        if: steps.contract.outputs.tag_exists != 'true'
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$RELEASE_SHA" --message "Release $TAG"
          git push origin "refs/tags/${TAG}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          TAG: ${{ steps.contract.outputs.tag }}
