# Clippy configuration (thresholds). Lint levels live in Cargo.toml [lints] and crate attributes.
cognitive-complexity-threshold = 15
too-many-arguments-threshold = 5
too-many-lines-threshold = 200
type-complexity-threshold = 250
single-char-binding-names-threshold = 2
excessive-nesting-threshold = 6

# Proc-macro dependencies are migrating from syn 2 to syn 3 independently.
# getrandom's WASI preview-2 and preview-3 bindings require different wit-bindgen versions.
# Their macro metadata also retains wasmparser's older hashbrown beside indexmap's version.
# See docs/tooling.md for the dependency check and removal condition.
allowed-duplicate-crates = ["syn", "wit-bindgen", "hashbrown"]
