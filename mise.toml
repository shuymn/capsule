#:schema https://mise.jdx.dev/schema/mise.json
# Development tools and tasks. Rust comes from rustup via rust-toolchain.toml;
# zsh, Git, and ps come from the system (see docs/tooling.md).
min_version = "2026.10.17"

[tools]
lefthook = "2.2.2"
uv = "0.13.6"

[tasks.build]
description = "Build the workspace"
run = "cargo build --workspace --locked"

[tasks."build:release"]
description = "Build optimized artifacts"
run = "cargo build --workspace --release --locked"

[tasks."release:check"]
description = "Validate the release candidate at HEAD (set RELEASE_SHA to pin an exact commit)"
quiet = true
run = 'bash scripts/release/check.sh "${RELEASE_SHA:-HEAD}"'

[tasks."release:prepare"]
description = "Prepare a release candidate: mise run release:prepare <patch|minor|major>"
usage = 'arg "<bump>" help="Version increment" { choices "patch" "minor" "major" }'
run = 'bash scripts/release/candidate.sh "${usage_bump}"'

[tasks."release:test"]
description = "Test release version synchronization and validation"
run = "bash scripts/release/check_test.sh"

[tasks.run]
description = "Run the default binary"
run = "cargo run -p capsule-cli"

[tasks."nix:check"]
description = "Check Nix flake outputs without updating flake.lock"
run = [
  "nix flake check --all-systems --no-build --no-update-lock-file",
  "nix flake check --no-update-lock-file --print-build-logs",
  "nix build --no-link --no-update-lock-file --print-build-logs .#default .#capsule",
  "nix run --no-update-lock-file .# -- --version",
  "nix run --no-update-lock-file .#capsule -- --version",
]

[tasks.test]
description = "Run PTY-driver CLI regressions plus unit, integration, and documentation tests"
run = [
  "uv run --no-project python -m unittest discover -s scripts -p test_session_pty.py",
  "cargo test --workspace --all-targets --all-features --locked",
  "cargo test --workspace --doc --all-features --locked",
]

[tasks."test:pty"]
description = "Run the real-PTY zsh/worker contract (requires zsh, git, and ps)"
depends = ["build"]
run = "uv run --no-project scripts/session_pty.py"

[tasks.doc]
description = "Build documentation without dependency docs"
run = "cargo doc --workspace --no-deps"

[tasks.lint]
description = "Run Clippy with warnings as errors (thresholds: clippy.toml, levels: Cargo.toml [lints])"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks."fmt:check"]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Format code"
alias = "fmt"
run = "cargo fmt --all"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks."install:lefthook"]
description = "Install git hooks if needed"
hide = true
quiet = true
run = '''
hook="$(git rev-parse --git-path hooks/pre-commit)"
grep -qs lefthook "$hook" || lefthook install
'''

[tasks."check:fast"]
description = "Run formatting checks, linting, release tests, and a normal build"
depends = ["install:lefthook"]
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "release:test" },
  { task = "build" },
]

[tasks."check:full"]
description = "Run formatting checks, linting, tests, documentation build, and build"
alias = "check"
depends = ["install:lefthook"]
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "release:test" },
  { task = "test" },
  { task = "doc" },
  { task = "build" },
]

[tasks."bench:prompt"]
description = "Benchmark capsule against starship (requires starship and git)"
depends = ["build:release"]
run = "cargo run -p capsule-prompt-bench --bin prompt-bench --release -- --capsule-bin target/release/capsule"

[tasks."bench:latency"]
description = "Compare prompt latency with Starship and a plain prompt (requires zsh, git, and starship)"
depends = ["build:release"]
run = 'uv run --no-project scripts/prompt_latency.py --capsule-bin target/release/capsule --output "$(mktemp -d)/latency"'

[tasks."docker:linux:build"]
description = "Build the Linux CI Docker image (override the name with CAPSULE_LINUX_CI_IMAGE)"
run = "docker buildx build --load --file docker/linux-ci.Dockerfile --tag ${CAPSULE_LINUX_CI_IMAGE:-capsule-linux-ci} ."

[tasks."docker:linux:lint"]
description = "Run Linux lint checks in Docker"
depends = ["docker:linux:build"]
run = "docker run --rm -it --user $(id -u):$(id -g) --env CARGO_HOME=/tmp/cargo --env RUSTUP_HOME=/tmp/rustup --volume ${PWD}:/workspace --workdir /workspace ${CAPSULE_LINUX_CI_IMAGE:-capsule-linux-ci} mise run lint"

[tasks."docker:linux:check"]
description = "Run full Linux verification in Docker without installing git hooks"
depends = ["docker:linux:build"]
run = "docker run --rm -it --user $(id -u):$(id -g) --env CARGO_HOME=/tmp/cargo --env RUSTUP_HOME=/tmp/rustup --volume ${PWD}:/workspace --workdir /workspace ${CAPSULE_LINUX_CI_IMAGE:-capsule-linux-ci} sh -c 'mise run fmt:check && mise run lint && mise run release:test && mise run test && mise run test:pty && mise run doc && mise run build'"
